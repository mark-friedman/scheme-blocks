<!DOCTYPE html>
<html>

<head>
    <title>SchemeBlocks</title>
    <!-- Import Scheme implementation and HTML adapter for <script type="text/scheme"> -->
    <script type="module" src="./libs/scheme.js"></script>
    <script type="module" src="./libs/scheme-html.js"></script>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        #blocklyDiv {
            height: 100%;
            width: 50%;
        }

        .split {
            height: 100%;
            width: 50%;
            position: fixed;
            z-index: 1;
            top: 0;
            overflow-x: hidden;
            padding-top: 20px;
        }

        .left {
            left: 0;
        }

        .right {
            right: 0;
        }

        #blocklyButton {
            float: right;
        }

        nav {
            position: relative;
            z-index: 10;
        }
    </style>
</head>

<body>
    <nav>
        <button id="blocklyButton">Generate Code</button>
    </nav>
    <div id='blocklyDiv' class="split left">
    </div>
    <div class="split right">
        <iframe id="scheme-frame" src="./repl-frame.html" width="100%" height="100%"></iframe>
    </div>

    <!-- Load webpack-bundled Blockly initialization -->
    <script type='text/javascript' src='./index.js'></script>

    <!-- Load Scheme application code (after Blockly is initialized) -->
    <script type="text/scheme" src="./src/utils/mixin.scm"></script>
    <script type="text/scheme" src="./src/blocks/mixins.scm"></script>
    <script type="text/scheme" src="./src/blocks/procedures.scm"></script>
    <script type="text/scheme" src="./src/app.scm"></script>

</body>

</html>
