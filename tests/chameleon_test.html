<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Chameleon Mixin Tests</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 20px;
        }

        #blocklyDiv {
            height: 400px;
            width: 100%;
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }

        .log {
            font-family: monospace;
            white-space: pre-wrap;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }
    </style>
    <script src="https://unpkg.com/blockly/blockly.min.js"></script>
    <script src="../libs/scheme.js"></script>
</head>

<body>
    <h1>Chameleon Mixin Tests</h1>
    <p>Tests for the chameleon block behavior - blocks should have all connections when floating,
        lose statement connectors when connected as expression, and vice versa.</p>

    <div id="blocklyDiv"></div>
    <div id="output" class="log"></div>

    <script>
        // Initialize Blockly workspace
        const workspace = Blockly.inject('blocklyDiv', {
            toolbox: {
                kind: 'categoryToolbox',
                contents: [
                    { kind: 'category', name: 'Procedures', colour: 230, contents: [] }
                ]
            }
        });

        // Expose for Scheme
        window.Blockly = Blockly;

        // Override console.log/error to show in output div
        const outputDiv = document.getElementById('output');
        const originalLog = console.log;
        const originalError = console.error;

        console.log = function (...args) {
            originalLog.apply(console, args);
            const line = document.createElement('div');
            line.className = 'success';
            line.textContent = args.join(' ');
            outputDiv.appendChild(line);
        };

        console.error = function (...args) {
            originalError.apply(console, args);
            const line = document.createElement('div');
            line.className = 'error';
            line.textContent = args.join(' ');
            outputDiv.appendChild(line);
        };
    </script>

    <!-- Load Scheme files -->
    <script type="text/scheme" src="../src/utils/mixin.scm"></script>
    <script type="text/scheme" src="../src/blocks/mixins.scm"></script>
    <script type="text/scheme" src="../src/blocks/procedures.scm"></script>

    <!-- Run tests -->
    <script type="text/scheme" src="chameleon_test.scm"></script>
</body>

</html>
